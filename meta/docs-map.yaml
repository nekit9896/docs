    notes: Считается актуальным (по словам владельца, 2026-11-17).

  - id: test-plan-hydro-calculation
    path: test-plans/hydro-calculation.md
    title: Тест-план hydro-calculation (HY-CALC-001…)
    confluence_source: confluence/test-plan-hydro-calculation.md
    status: pending-review
    notes: Считается актуальным (по словам владельца, 2026-11-17). Источник истины по кейсам HY-CALC.

  - id: test-plan-hydro-history-and-model
    path: test-plans/hydro-history-and-model.md
    title: Тест-план hydro-history-and-model (HY-HIST-001…)
    confluence_source: confluence/test-plan-hydro-history-and-model.md
    status: pending-review
    notes: Считается актуальным (по словам владельца, 2026-11-17). Источник истины по кейсам HY-HIST.

  - id: test-plan-system-tests
    path: test-plans/system-tests.md
    title: Тест-план системных тестов
    confluence_source: confluence/test-plan-of-system-tests.md
    status: pending-review
    notes: Считается актуальным (по словам владельца, 2026-11-17).

  - id: roadmap-coverage
    path: roadmap/roadmap-coverage.md
    title: Роадмап покрытия тестирования Гидроуклона
    confluence_source: confluence/roadmap_coverage.md
    status: stale
    notes: >
      Устаревший черновик: цифры расходятся с тест-планами, есть ссылки на
      несуществующие документы, нет сроков. Переработка со сроками — в конце
      финализации документации.

# Синхронизация с корпоративным Confluence.
sync:
  source_of_truth: working docs (строки path выше)
  confluence_dir: confluence/
  rule: >
    При изменении рабочего документа актуализировать соответствующий файл
    confluence_source (формат .md, пригодный для перетаскивания в Confluence)
    и обновить поле updated здесь. Маппинг «рабочий документ -> страница
    Confluence» фиксировать в этом файле.
  confluence_page_titles:
    confluence/C4.md: C4
    confluence/roadmap_coverage.md: roadmap_coverage
    confluence/test-plan-hydro-calculation.md: test-plan hydro-calculation
    confluence/test-plan-hydro-history-and-model.md: test-plan hydro-history-and-model
    confluence/test-plan-of-system-tests.md: test-plan of system tests
    confluence/hmi-backend-descr.md: hmi-backend descr

