# Человекочитаемая версия карты: ../README.md
version: 1
updated: 2026-11-17
product:
  canonical_name_ru: Гидроуклон
  canonical_name_en: hydroslope
  platform: ЭВОСКАДА (СДКУ)
  note: >
    «Гидроклон» в старых документах — опечатка, не использовать.
    Автотесты покрывают часть СДКУ — Гидроуклон (нефть в трубопроводах).

# Статусы: actual | draft | stale | pending-review
# pending-review — статус будет выставлен по итогам глубокого анализа содержания (фаза 2).
docs:
  - id: c4-container-level
    path: architecture/c4-container-level.md
